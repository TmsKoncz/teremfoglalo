<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SZAG Teremfoglaló</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Stílusok (változatlan) */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: #888; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #555; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .spinner { border: 4px solid rgba(0, 0, 0, 0.1); width: 36px; height: 36px; border-radius: 50%; border-left-color: #4f46e5; animation: spin 1s linear infinite; }
        .modal-enter { opacity: 0; transform: scale(0.95); }
        .modal-enter-active { opacity: 1; transform: scale(1); transition: opacity 300ms, transform 300ms; }
        .modal-leave { opacity: 1; transform: scale(1); }
        .modal-leave-active { opacity: 0; transform: scale(0.95); transition: opacity 300ms, transform 300ms; }
        .hidden { display: none; }
        /* Admin action overlay */
        #admin-action-overlay { position: absolute; inset: 0; background-color: rgba(255, 255, 255, 0.75); display: flex; justify-content: center; align-items: center; z-index: 20; }
        #admin-action-overlay .spinner { width: 24px; height: 24px; } /* Kisebb spinner az admin felületre */
    </style>
</head>
<body class="bg-gray-100 font-sans">

    <header id="app-header" class="bg-indigo-600 text-white p-4 shadow-md sticky top-0 z-30">
        <div class="container mx-auto flex flex-wrap justify-between items-center gap-y-2">
            <h1 class="text-xl font-bold cursor-pointer" onclick="navigateTo('#/')">SZAG Teremfoglaló</h1>
            <nav class="flex items-center space-x-2 sm:space-x-4">
                <div id="nav-links" class="flex items-center space-x-2 sm:space-x-4"></div>
                <div id="user-status" class="flex items-center space-x-2"></div>
            </nav>
        </div>
    </header>

    <main id="main-content" class="container mx-auto mt-4 pb-16">
        <div id="loading-view" class="flex flex-col justify-center items-center h-64 text-xl text-gray-600">
            <div class="spinner mb-4"></div>
            <p>Alkalmazás betöltése...</p>
        </div>
        <div id="error-view" class="hidden p-4 text-center text-red-700 bg-red-100 rounded-lg"></div>
        <div id="weekly-view" class="hidden"></div>
        <div id="daily-summary-view" class="hidden"></div>
        <div id="room-view" class="hidden"></div>
        <div id="admin-view" class="hidden"></div>
        <div id="login-required-view" class="hidden text-center p-8">
            <p class="text-xl text-gray-700">A tartalom megtekintéséhez bejelentkezés szükséges.</p>
        </div>
    </main>

    <div id="login-popup" class="hidden fixed bottom-0 left-0 right-0 bg-gray-800 text-white p-4 shadow-lg z-50 flex justify-center items-center">
        <p class="mr-4">A foglaláshoz és a tartalom megtekintéséhez bejelentkezés szükséges.</p>
        <button id="google-login-button" class="bg-red-600 hover:bg-red-700 text-white font-bold py-2 px-4 rounded inline-flex items-center transition duration-150 ease-in-out">
            <svg class="fill-current w-4 h-4 mr-2" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48px" height="48px"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/><path fill="none" d="M0 0h48v48H0z"/></svg>
            <span id="login-button-text">Bejelentkezés Google fiókkal</span>
            <svg id="login-spinner" class="hidden animate-spin ml-2 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
        </button>
    </div>

    <div id="booking-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex justify-center items-center z-50 p-4 modal-enter">
        <div class="bg-white p-6 rounded-lg shadow-xl w-full max-w-md">
            <h3 class="text-xl font-bold mb-4 text-indigo-700">Teremfoglalás</h3>
            <div class="space-y-3 mb-4 text-gray-700">
                <p><span class="font-semibold">Terem:</span> <span id="modal-room-name"></span></p>
                <p><span class="font-semibold">Nap:</span> <span id="modal-day"></span></p>
                <p><span class="font-semibold">Idősáv:</span> <span id="modal-timeslot"></span></p>
            </div>
            <div class="mb-4">
                <label for="bookingUser" class="block text-sm font-medium text-gray-700 mb-1">Foglaló neve / Foglalás célja:</label>
                <input type="text" id="bookingUser" class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500" placeholder="Pl. Nagy Péter / 10.A Informatika óra">
            </div>
            <div id="modal-recurring-option" class="hidden mb-4">
                <label class="flex items-center space-x-2 cursor-pointer">
                    <input type="checkbox" id="modal-is-recurring" class="rounded border-gray-300 text-indigo-600 shadow-sm focus:ring-indigo-500">
                    <span class="text-sm text-gray-700">Rendszeres foglalás (minden héten)</span>
                </label>
            </div>
            <div class="flex justify-end space-x-3">
                <button id="modal-cancel-button" class="px-4 py-2 bg-gray-300 text-gray-800 rounded-md hover:bg-gray-400 transition duration-150">Mégse</button>
                <button id="modal-confirm-button" class="px-4 py-2 bg-indigo-600 text-white rounded-md hover:bg-indigo-700 transition duration-150 flex items-center">
                    <span id="modal-confirm-text">Foglalás Mentése</span>
                     <svg id="modal-spinner" class="hidden animate-spin ml-2 h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <footer class="text-center text-gray-500 text-sm py-4 mt-8">
        SZAG Teremfoglaló &copy; <span id="current-year"></span>
    </footer>

    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-firestore-compat.js"></script>

    <script>
        // --- Firebase Konfiguráció ---
        // !!! FIGYELEM: Éles környezetben ezeket a kulcsokat ne így tárold! !!!
        const firebaseConfig = {
            apiKey: "AIzaSyAs8pqCdCnyFDRivyUJJPh9nc0R1yNCAys", // <- CSERÉLD LE A SAJÁT KULCSODRA!
            authDomain: "teremfoglalo-913e0.firebaseapp.com", // <- CSERÉLD LE!
            projectId: "teremfoglalo-913e0", // <- CSERÉLD LE!
            storageBucket: "teremfoglalo-913e0.firebasestorage.app", // <- CSERÉLD LE!
            messagingSenderId: "705982282868", // <- CSERÉLD LE!
            appId: "1:705982282868:web:183b3c35161ee0bffce521" // <- CSERÉLD LE!
        };

        // --- Globális Változók ---
        let firebaseApp;
        let firestore;
        let auth;
        let googleProvider;
        let currentUser = null;
        let rooms = [];
        let timeSlots = [];
        let bookings = [];
        let allowedUsers = [];
        let currentView = 'loading';
        let currentRoomId = null;
        let unsubscribeListeners = [];
        const STATIC_DAYS = ['Hétfő', 'Kedd', 'Szerda', 'Csütörtök', 'Péntek']; // Statikus napok

        // --- DOM Elemek Referenciái ---
        const loadingView = document.getElementById('loading-view');
        const errorView = document.getElementById('error-view');
        const weeklyViewDiv = document.getElementById('weekly-view');
        const dailySummaryViewDiv = document.getElementById('daily-summary-view');
        const roomViewDiv = document.getElementById('room-view');
        const adminViewDiv = document.getElementById('admin-view');
        const loginRequiredView = document.getElementById('login-required-view');
        const loginPopup = document.getElementById('login-popup');
        const googleLoginButton = document.getElementById('google-login-button');
        const loginButtonText = document.getElementById('login-button-text');
        const loginSpinner = document.getElementById('login-spinner');
        const userStatusDiv = document.getElementById('user-status');
        const navLinksDiv = document.getElementById('nav-links');
        const mainContent = document.getElementById('main-content');
        const bookingModal = document.getElementById('booking-modal');
        const modalRoomName = document.getElementById('modal-room-name');
        const modalDay = document.getElementById('modal-day');
        const modalTimeslot = document.getElementById('modal-timeslot');
        const modalBookingUserInput = document.getElementById('bookingUser');
        const modalRecurringOptionDiv = document.getElementById('modal-recurring-option');
        const modalIsRecurringCheckbox = document.getElementById('modal-is-recurring');
        const modalCancelButton = document.getElementById('modal-cancel-button');
        const modalConfirmButton = document.getElementById('modal-confirm-button');
        const modalConfirmText = document.getElementById('modal-confirm-text');
        const modalSpinner = document.getElementById('modal-spinner');

        // --- Inicializálás ---
        function initializeApp() {
            console.log("initializeApp() called");
            try {
                if (!firebaseConfig || !firebaseConfig.apiKey) throw new Error("Firebase konfiguráció hiányzik.");
                firebaseApp = firebase.initializeApp(firebaseConfig);
                firestore = firebase.firestore();
                auth = firebase.auth();
                googleProvider = new firebase.auth.GoogleAuthProvider();
                console.log("Firebase sikeresen inicializálva (compat).");
                setupEventListeners();
                setupAuthListener();
                document.getElementById('current-year').textContent = new Date().getFullYear();
                console.log("initializeApp() finished successfully.");
            } catch (error) {
                console.error("Firebase inicializálási hiba:", error);
                showError(`Firebase inicializálása sikertelen: ${error.message}.`);
            }
        }

        // --- Nézetváltás ---
        function switchView(viewId, roomId = null) {
            console.log(`Switching view to: ${viewId}`, roomId ? `with roomId: ${roomId}` : '');
            currentView = viewId;
            currentRoomId = roomId;

            [loadingView, errorView, weeklyViewDiv, dailySummaryViewDiv, roomViewDiv, adminViewDiv, loginRequiredView]
                .forEach(el => el.classList.add('hidden'));

            const viewElement = document.getElementById(`${viewId}-view`);
            if (viewElement) {
                viewElement.classList.remove('hidden');
                if (viewId !== 'loading' && viewId !== 'error') {
                    console.log(`Rendering view: ${viewId}`);
                    renderView(); // Rendereljük az új nézetet
                }
            } else {
                console.error(`View element not found: ${viewId}-view`);
                showError(`A kért nézet (${viewId}) nem található.`);
            }
            updateNavLinks();
        }

        // --- Útvonal Kezelés ---
        function handleRouteChange() {
            console.log("handleRouteChange() called");
            const hash = window.location.hash || '#/';
            console.log("Current hash:", hash);

            if (currentView === 'loading' || currentView === 'error') return;

            if (!currentUser && hash !== '#/login') {
                switchView('login-required');
                return;
            }

            let targetView = '';
            let targetRoomId = null;

            if (hash === '#/') targetView = 'weekly';
            else if (hash === '#/view') targetView = 'daily-summary';
            else if (hash.startsWith('#/room?id=')) {
                targetRoomId = hash.split('=')[1];
                targetView = 'room';
            } else if (hash === '#/admin') {
                targetView = currentUser?.isAdmin ? 'admin' : 'weekly';
                if (!currentUser?.isAdmin) navigateTo('#/'); // Redirect if not admin
            } else {
                targetView = 'weekly';
                if (window.location.hash !== '#/') navigateTo('#/');
            }

            if (targetView !== currentView || (targetView === 'room' && targetRoomId !== currentRoomId)) {
                 switchView(targetView, targetRoomId);
            }
        }

        function navigateTo(hash) {
            console.log("Navigating to:", hash);
            if(window.location.hash === hash && currentView !== 'loading') return;
            window.location.hash = hash;
        }

        // --- Hiba Megjelenítés ---
        function showError(message) {
            console.error("Showing error:", message);
            errorView.textContent = `Hiba: ${message}`;
            [loadingView, weeklyViewDiv, dailySummaryViewDiv, roomViewDiv, adminViewDiv, loginRequiredView]
                .forEach(el => el.classList.add('hidden'));
            errorView.classList.remove('hidden');
            currentView = 'error';
        }

        // --- Felhasználói Felület Frissítése ---
        function updateUIBasedOnAuthState(user) {
             console.log("updateUIBasedOnAuthState called with user:", user ? user.uid : null);
            if (user) {
                currentUser = user;
                loginPopup.classList.add('hidden');
                userStatusDiv.innerHTML = `
                    <span class="text-sm hidden lg:inline" title="${escapeHtml(user.email)}">${escapeHtml(user.displayName || user.email)} ${user.isAdmin ? '<span class="text-yellow-300">(Admin)</span>' : ''}</span>
                    <button id="logout-button" class="bg-red-500 hover:bg-red-600 text-white text-xs sm:text-sm font-semibold py-1 px-2 sm:px-3 rounded transition duration-150 ease-in-out">
                        Kijelentkezés
                    </button>
                `;
                const logoutBtn = document.getElementById('logout-button');
                if (logoutBtn) {
                    logoutBtn.removeEventListener('click', handleLogout);
                    logoutBtn.addEventListener('click', handleLogout);
                }
                setupFirestoreListeners();
                handleRouteChange(); // Trigger route check after login

            } else {
                currentUser = null;
                loginPopup.classList.remove('hidden');
                userStatusDiv.innerHTML = `<span class="text-sm text-indigo-200">Nincs bejelentkezve</span>`;
                unsubscribeFirestoreListeners();
                rooms = []; timeSlots = []; bookings = []; allowedUsers = [];
                if (currentView !== 'loading' && currentView !== 'error') {
                     switchView('login-required');
                }
            }
             updateNavLinks();
        }

        function updateNavLinks() {
            let linksHtml = `
                <button onclick="navigateTo('#/')" class="hover:bg-indigo-700 px-2 py-1 sm:px-3 rounded text-sm sm:text-base ${currentView === 'weekly' ? 'bg-indigo-800 font-semibold' : ''}">Heti nézet</button>
                <button onclick="navigateTo('#/view')" class="hover:bg-indigo-700 px-2 py-1 sm:px-3 rounded text-sm sm:text-base ${currentView === 'daily-summary' ? 'bg-indigo-800 font-semibold' : ''}">Napi összesítő</button>
            `;
            if (currentUser?.isAdmin) {
                linksHtml += `
                    <button onclick="navigateTo('#/admin')" class="hover:bg-purple-700 px-2 py-1 sm:px-3 rounded text-sm sm:text-base ${currentView === 'admin' ? 'bg-purple-800 font-semibold' : 'bg-purple-600'}">Admin</button>
                `;
            }
            navLinksDiv.innerHTML = linksHtml;
        }


        // --- Renderelő Függvények ---
        function renderView() {
            if (!currentUser && !['login-required', 'loading', 'error'].includes(currentView)) {
                 switchView('login-required');
                 return;
            }
            console.log(`Attempting to render view: ${currentView}`);
            try {
                switch (currentView) {
                    case 'weekly': renderWeeklyView(); break;
                    case 'daily-summary': renderDailySummaryView(); break;
                    case 'room': renderRoomView(); break;
                    case 'admin': renderAdminView(); break;
                }
            } catch (error) {
                console.error(`Error rendering view ${currentView}:`, error);
                showError(`Hiba történt a(z) ${currentView} nézet megjelenítésekor: ${error.message}`);
            }
        }

        // --- Heti Nézet Renderelése ---
        function renderWeeklyView() {
            if (!currentUser) return switchView('login-required');
            console.log("Rendering Weekly View...");
            weeklyViewDiv.innerHTML = '';

            const sortedTimeSlots = [...timeSlots].sort((a, b) => (a.order ?? 0) - (b.order ?? 0));
            const sortedRooms = [...rooms].sort((a, b) => a.name.localeCompare(b.name));
            const days = STATIC_DAYS;

            let tableHTML = `
                <h2 class="text-2xl font-bold mb-4 text-center text-gray-800">Heti Teremfoglalások</h2>
                <div class="overflow-x-auto shadow-md rounded-lg border border-gray-200">
                    <table class="min-w-full divide-y divide-gray-200">
                        <thead class="bg-gray-100">
                            <tr>
                                <th class="px-3 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider sticky left-0 bg-gray-100 z-10 border-r">Idő / Nap</th>
                                ${days.map(day => `<th class="px-3 py-3 text-center text-xs font-medium text-gray-500 uppercase tracking-wider whitespace-nowrap border-l">${day}</th>`).join('')}
                            </tr>
                        </thead>
                        <tbody class="bg-white divide-y divide-gray-200">
                            ${sortedTimeSlots.map(slot => `
                                <tr class="divide-x divide-gray-100">
                                    <td class="px-3 py-4 whitespace-nowrap font-medium text-gray-900 sticky left-0 bg-white z-10 border-r">${escapeHtml(slot.value)}</td>
                                    ${days.map(day => `
                                        <td class="px-2 py-2 whitespace-nowrap text-sm text-gray-500 align-top">
                                            <ul class="space-y-1">
                                                ${sortedRooms.map(room => {
                                                    const booking = bookings.find(b => b.roomId === room.id && b.day === day && b.timeSlot === slot.value);
                                                    const isBooked = !!booking;
                                                    const canDelete = currentUser && booking && (currentUser.uid === booking.userId || currentUser.isAdmin);
                                                    return `
                                                        <li class="flex items-center space-x-1.5 text-xs group relative">
                                                            <span class="inline-block w-2.5 h-2.5 rounded-full flex-shrink-0 ${isBooked ? 'bg-red-500' : 'bg-green-500'}" title="${isBooked ? 'Foglalt' : 'Szabad'}"></span>
                                                            <span class="flex-grow overflow-hidden overflow-ellipsis whitespace-nowrap ${isBooked ? 'text-gray-700' : 'text-gray-500'}">
                                                                ${escapeHtml(room.name)}
                                                                ${isBooked ? `<span class="text-red-700 font-medium"> (${escapeHtml(booking.user?.split(' ')[0] || '')}${booking.type === 'recurring' ? ' R' : ''})</span>` : ''}
                                                            </span>
                                                            ${!isBooked && currentUser ? `
                                                                <button
                                                                    onclick="openBookingModal('${room.id}', '${escapeJsString(room.name)}', '${day}', '${escapeJsString(slot.value)}')"
                                                                    class="ml-auto text-indigo-600 hover:text-indigo-900 text-[10px] font-semibold px-1 py-0.5 rounded hover:bg-indigo-50 opacity-0 group-hover:opacity-100 transition-opacity"
                                                                    title="Foglalás: ${escapeHtml(room.name)}, ${day}, ${escapeHtml(slot.value)}">
                                                                    Foglal
                                                                </button>
                                                            ` : ''}
                                                            ${isBooked && canDelete ? `
                                                                <button
                                                                    onclick="deleteBooking('${booking.id}', '${escapeJsString(room.name)}', '${day}', '${escapeJsString(slot.value)}', '${escapeJsString(booking.user)}')"
                                                                    class="ml-1 text-red-500 hover:text-red-800 text-[10px] font-semibold px-1 py-0.5 rounded hover:bg-red-50 opacity-0 group-hover:opacity-100 transition-opacity"
                                                                    title="Foglalás Törlése">
                                                                    X
                                                                </button>
                                                            ` : ''}
                                                        </li>
                                                    `;
                                                }).join('')}
                                            </ul>
                                        </td>
                                    `).join('')}
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
            `;
            weeklyViewDiv.innerHTML = tableHTML;
        }

         // --- Napi Összesítő Nézet Renderelése ---
        function renderDailySummaryView() {
             if (!currentUser) return switchView('login-required');
             console.log("Rendering Daily Summary View...");
             dailySummaryViewDiv.innerHTML = '';

             const today = getTodayDayName();
             const currentTime = new Date().toLocaleTimeString('hu-HU', { hour: '2-digit', minute: '2-digit' });

             const todayBookings = bookings
                .filter(b => b.day === today)
                .sort((a, b) => {
                    const roomA = rooms.find(r => r.id === a.roomId)?.name || a.roomId;
                    const roomB = rooms.find(r => r.id === b.roomId)?.name || b.roomId;
                    if (roomA !== roomB) return roomA.localeCompare(roomB);
                    return (a.timeSlot || "").localeCompare(b.timeSlot || "");
                });

            let summaryHTML = `
                <h2 class="text-2xl font-bold mb-4 text-center text-gray-800">Mai Teremfoglalások (${today})</h2>
                <p class="text-center text-gray-600 mb-4">Jelenlegi idő: ${currentTime}</p>
            `;

            if (todayBookings.length === 0) {
                summaryHTML += `<p class="text-center text-gray-500 mt-8">Ma nincsenek foglalások.</p>`;
            } else {
                summaryHTML += `<div class="space-y-4">`;
                const sortedRooms = [...rooms].sort((a, b) => a.name.localeCompare(b.name));
                sortedRooms.forEach(room => {
                    const roomBookings = todayBookings.filter(b => b.roomId === room.id);
                    if (roomBookings.length > 0) {
                        summaryHTML += `
                            <div class="bg-white p-4 rounded-lg shadow">
                                <h3 class="text-lg font-semibold mb-2 text-indigo-700">${escapeHtml(room.name)}</h3>
                                <ul class="divide-y divide-gray-200">
                                    ${roomBookings.map(booking => `
                                        <li class="py-2 flex justify-between items-center">
                                            <div>
                                                <span class="font-medium text-gray-800">${escapeHtml(booking.timeSlot)}</span>
                                                <span class="ml-2 text-gray-600"> - ${escapeHtml(booking.user)}</span>
                                            </div>
                                            <span class="text-xs px-2 py-0.5 rounded-full ${booking.type === 'recurring' ? 'bg-yellow-200 text-yellow-800' : 'bg-green-200 text-green-800'}">
                                                ${booking.type === 'recurring' ? 'Rendszeres' : 'Egyszeri'}
                                            </span>
                                        </li>
                                    `).join('')}
                                </ul>
                            </div>
                        `;
                    }
                });
                summaryHTML += `</div>`;
            }
            dailySummaryViewDiv.innerHTML = summaryHTML;
        }

        // --- Szoba Nézet Renderelése ---
        function renderRoomView() {
            if (!currentUser) return switchView('login-required');
            if (!currentRoomId) return showError("Nincs kiválasztott szoba ID.");

            const room = rooms.find(r => r.id === currentRoomId);
            if (!room) return showError(`A(z) ${currentRoomId} ID-jű szoba nem található.`);

            console.log(`Rendering Room View for: ${room.name}`);
            roomViewDiv.innerHTML = '';

            const today = getTodayDayName();
            const sortedTimeSlots = [...timeSlots].sort((a, b) => (a.order ?? 0) - (b.order ?? 0));
            const currentTimeSlotValue = getCurrentTimeSlot(timeSlots);

            const roomBookingsToday = bookings
                .filter(b => b.roomId === room.id && b.day === today)
                .sort((a, b) => (a.timeSlot || "").localeCompare(b.timeSlot || ""));

            let roomHTML = `
                <h2 class="text-3xl md:text-4xl font-bold mb-6 text-center text-indigo-800">${escapeHtml(room.name)} - Mai Beosztás (${today})</h2>
            `;

            if (sortedTimeSlots.length === 0) {
                 roomHTML += `<p class="text-center text-gray-500 mt-10 text-lg">Nincsenek elérhető idősávok definiálva.</p>`;
            } else {
                roomHTML += `<ul class="space-y-3">`;
                let hasBookingsToday = roomBookingsToday.length > 0; // Check if there are any bookings at all for this room today

                sortedTimeSlots.forEach(slot => {
                     const booking = roomBookingsToday.find(b => b.timeSlot === slot.value);
                     const isActive = slot.value === currentTimeSlotValue;

                     roomHTML += `
                        <li class="p-4 md:p-6 rounded-lg shadow transition-all duration-300 ease-in-out ${
                            isActive
                            ? (booking ? 'bg-green-200 border-l-4 border-green-600 scale-105 ring-2 ring-green-300' : 'bg-gray-300 border-l-4 border-gray-500 scale-105')
                            : (booking ? 'bg-white border-l-4 border-blue-500' : 'bg-gray-100 border-l-4 border-gray-400')
                        }">
                            <div class="flex flex-col md:flex-row justify-between items-start md:items-center ${isActive ? 'space-y-2 md:space-y-0' : ''}">
                                <div class="${isActive ? 'flex-grow' : ''}">
                                    <span class="font-bold block text-lg md:text-xl ${isActive ? (booking ? 'text-green-900' : 'text-gray-700') : (booking ? 'text-gray-800' : 'text-gray-500')}">${escapeHtml(slot.value)}</span>
                                    ${booking ? `
                                        <span class="block text-base md:text-lg ${isActive ? 'text-green-800 font-semibold' : 'text-gray-600'}">
                                            Foglalta: ${escapeHtml(booking.user)}
                                        </span>
                                    ` : `
                                         <span class="text-sm ${isActive ? 'text-gray-600 font-semibold' : 'text-gray-400'}">
                                            ${isActive ? 'Szabad (Most)' : 'Szabad'}
                                        </span>
                                    `}
                                </div>
                                ${booking ? `
                                    <span class="mt-2 md:mt-0 text-xs px-3 py-1 rounded-full self-start md:self-center ${
                                        isActive ? (booking.type === 'recurring' ? 'bg-yellow-300 text-yellow-900' : 'bg-blue-300 text-blue-900')
                                                 : (booking.type === 'recurring' ? 'bg-yellow-100 text-yellow-800' : 'bg-blue-100 text-blue-800')
                                    }">
                                        ${booking.type === 'recurring' ? 'Rendszeres' : 'Egyszeri'}
                                        ${isActive ? ' (Most zajlik)' : ''}
                                    </span>
                                ` : ''}
                            </div>
                             ${isActive && booking ? `<p class="mt-2 text-sm text-green-700">Ez a foglalás jelenleg aktív.</p>` : ''}
                        </li>
                     `;
                });
                roomHTML += `</ul>`;

                // Show message only if there are timeslots but no bookings found for the day
                if (sortedTimeSlots.length > 0 && !hasBookingsToday) {
                     roomHTML += `<p class="text-center text-gray-500 mt-10 text-lg">Ma nincs foglalás ebben a teremben.</p>`;
                }
            }

            roomViewDiv.innerHTML = roomHTML;
        }

        // --- Segédfüggvények ---
        function escapeHtml(unsafe) {
             if (unsafe === null || typeof unsafe === 'undefined') return '';
            return unsafe.toString().replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }
        function escapeJsString(unsafe) {
              if (unsafe === null || typeof unsafe === 'undefined') return '';
             return unsafe.toString().replace(/'/g, "\\'").replace(/"/g, '\\"').replace(/\n/g, '\\n'); // Handle newlines too
        }


        // --- Firebase Hitelesítés ---
        function setupAuthListener() {
             console.log("setupAuthListener() called");
             if (!auth) return showError("Auth szolgáltatás nem inicializálódott.");
             auth.onAuthStateChanged(async (user) => {
                 console.log("onAuthStateChanged triggered. User:", user ? user.uid : null);
                if (user) {
                    console.log("User signed in, checking authorization...");
                    const userDocRef = firestore.collection('allowedUsers').doc(user.uid);
                    try {
                        const userDoc = await userDocRef.get();
                        if (userDoc.exists) {
                            console.log("User document exists.");
                            const userData = userDoc.data();
                            updateUIBasedOnAuthState({
                                uid: user.uid,
                                displayName: user.displayName,
                                email: user.email,
                                isAdmin: userData.isAdmin || false,
                            });
                        } else {
                            console.warn("User document does not exist. User not allowed:", user.email);
                            alert(`Hozzáférés megtagadva ehhez az email címhez: ${user.email}. Jelentkezz ki, vagy kérj hozzáférést egy adminisztrátortól.`);
                            await auth.signOut();
                        }
                    } catch (error) {
                        console.error("Error checking user authorization:", error);
                        showError("Hiba történt a felhasználói jogosultság ellenőrzésekor.");
                        await auth.signOut().catch(e => console.error("Sign out failed:", e));
                    }
                } else {
                    console.log("User signed out.");
                    updateUIBasedOnAuthState(null);
                }
            }, (error) => {
                 console.error("Error in onAuthStateChanged listener:", error);
                 showError("Hiba történt a bejelentkezési állapot figyelésekor.");
                 updateUIBasedOnAuthState(null);
            });
        }

        // --- Firestore Listenerek ---
        function setupFirestoreListeners() {
            if (!firestore || !currentUser) return;
            console.log("Setting up Firestore listeners...");
            unsubscribeFirestoreListeners();
            let initialDataLoaded = { rooms: false, timeSlots: false, bookings: false, allowedUsers: !currentUser.isAdmin }; // Track initial load

            function checkInitialLoadComplete() {
                if (initialDataLoaded.rooms && initialDataLoaded.timeSlots && initialDataLoaded.bookings && initialDataLoaded.allowedUsers) {
                     console.log("Initial data load complete.");
                     // Itt már nem kell loading state-et állítani, mert a renderView gondoskodik róla
                }
            }

            try {
                const roomsRef = firestore.collection('rooms').orderBy('name');
                const unsubRooms = roomsRef.onSnapshot((snapshot) => {
                    rooms = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    console.log("Rooms updated:", rooms.length);
                    initialDataLoaded.rooms = true; checkInitialLoadComplete();
                    renderView();
                }, (error) => { console.error("Error fetching rooms:", error); showError("Hiba a termek betöltésekor."); initialDataLoaded.rooms = true; checkInitialLoadComplete(); });
                unsubscribeListeners.push(unsubRooms);

                const timeSlotsRef = firestore.collection('timeSlots').orderBy('order', 'asc');
                 const unsubTimeSlots = timeSlotsRef.onSnapshot((snapshot) => {
                    timeSlots = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    console.log("Time slots updated:", timeSlots.length);
                    initialDataLoaded.timeSlots = true; checkInitialLoadComplete();
                    renderView();
                }, (error) => { console.error("Error fetching time slots:", error); showError("Hiba az idősávok betöltésekor."); initialDataLoaded.timeSlots = true; checkInitialLoadComplete(); });
                unsubscribeListeners.push(unsubTimeSlots);

                const bookingsRef = firestore.collection('bookings');
                 const unsubBookings = bookingsRef.onSnapshot((snapshot) => {
                    bookings = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    console.log("Bookings updated:", bookings.length);
                    initialDataLoaded.bookings = true; checkInitialLoadComplete();
                    renderView();
                }, (error) => { console.error("Error fetching bookings:", error); showError("Hiba a foglalások betöltésekor."); initialDataLoaded.bookings = true; checkInitialLoadComplete(); });
                unsubscribeListeners.push(unsubBookings);

                if (currentUser.isAdmin) {
                    const allowedUsersRef = firestore.collection('allowedUsers').orderBy('email');
                    const unsubAllowedUsers = allowedUsersRef.onSnapshot((snapshot) => {
                        allowedUsers = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                        console.log("Allowed users updated:", allowedUsers.length);
                        initialDataLoaded.allowedUsers = true; checkInitialLoadComplete();
                         if (currentView === 'admin') renderAdminView();
                    }, (error) => { console.error("Error fetching allowed users:", error); initialDataLoaded.allowedUsers = true; checkInitialLoadComplete(); });
                    unsubscribeListeners.push(unsubAllowedUsers);
                }
            } catch (error) {
                 console.error("Error setting up Firestore listeners:", error);
                 showError("Hiba az adatbázis figyelőinek beállításakor.");
            }
        }

        function unsubscribeFirestoreListeners() {
            console.log(`Unsubscribing ${unsubscribeListeners.length} listeners.`);
            unsubscribeListeners.forEach(unsub => unsub());
            unsubscribeListeners = [];
        }

        // --- Admin Műveletek ---
        async function addRoom() {
             if (!currentUser?.isAdmin || !firestore) return alert("Nincs jogosultságod.");
            const roomNameInput = document.getElementById('newRoomName');
            const roomName = roomNameInput.value.trim();
            if (!roomName) return alert('Add meg a terem nevét!');
            setAdminLoading(true);
            try {
                await firestore.collection('rooms').add({ name: roomName });
                roomNameInput.value = '';
                alert('Terem hozzáadva.');
            } catch (error) { alert(`Hiba: ${error.message}`); }
            finally { setAdminLoading(false); }
        }
        async function deleteRoom(roomId, roomName) {
              if (!currentUser?.isAdmin || !firestore) return alert("Nincs jogosultságod.");
             if (!confirm(`Biztosan törlöd: "${roomName}"?\nFIGYELEM: Ez törli a foglalásait is!`)) return;
             setAdminLoading(true);
             try {
                const batch = firestore.batch();
                batch.delete(firestore.collection('rooms').doc(roomId));
                const bookingsSnap = await firestore.collection('bookings').where('roomId', '==', roomId).get();
                bookingsSnap.forEach(doc => batch.delete(doc.ref));
                await batch.commit();
                alert(`"${roomName}" terem és foglalásai törölve.`);
            } catch (error) { alert(`Hiba: ${error.message}`); }
            finally { setAdminLoading(false); }
        }
        async function addTimeSlot() {
             if (!currentUser?.isAdmin || !firestore) return alert("Nincs jogosultságod.");
            const valueInput = document.getElementById('newTimeSlotValue');
            const orderInput = document.getElementById('newTimeSlotOrder');
            const value = valueInput.value.trim();
            const order = parseInt(orderInput.value, 10) || 0;
            if (!value || !/^\d{2}:\d{2}\s*-\s*\d{2}:\d{2}$/.test(value)) return alert('Hibás idősáv formátum!');
            setAdminLoading(true);
            try {
                await firestore.collection('timeSlots').add({ value, order });
                valueInput.value = '';
                alert('Idősáv hozzáadva.');
            } catch (error) { alert(`Hiba: ${error.message}`); }
            finally { setAdminLoading(false); }
        }
        async function deleteTimeSlot(slotId, slotValue) {
             if (!currentUser?.isAdmin || !firestore) return alert("Nincs jogosultságod.");
            if (!confirm(`Biztosan törlöd: "${slotValue}"?`)) return;
            setAdminLoading(true);
            try {
                await firestore.collection('timeSlots').doc(slotId).delete();
                alert(`"${slotValue}" idősáv törölve.`);
            } catch (error) { alert(`Hiba: ${error.message}`); }
            finally { setAdminLoading(false); }
        }
        async function addAllowedUser() {
              if (!currentUser?.isAdmin || !firestore) return alert("Nincs jogosultságod.");
             const uidInput = document.getElementById('newUserUid');
             const emailInput = document.getElementById('newUserEmail');
             const isAdminCheckbox = document.getElementById('newUserIsAdmin');
             const uid = uidInput.value.trim();
             const email = emailInput.value.trim().toLowerCase();
             const isAdmin = isAdminCheckbox.checked;
             if (!uid || !email || !email.includes('@')) return alert('Add meg a UID-t és egy érvényes email címet!');
             const docRef = firestore.collection('allowedUsers').doc(uid);
             const docSnap = await docRef.get();
             if (docSnap.exists && !confirm(`UID (${uid}) már létezik. Frissíted?`)) return;
             setAdminLoading(true);
             try {
                 await docRef.set({ email, isAdmin });
                 uidInput.value = ''; emailInput.value = ''; isAdminCheckbox.checked = false;
                 alert('Felhasználó hozzáadva/frissítve.');
             } catch (error) { alert(`Hiba: ${error.message}`); }
             finally { setAdminLoading(false); }
        }
        async function deleteAllowedUser(userId, userEmail) {
             if (!currentUser?.isAdmin || !firestore) return alert("Nincs jogosultságod.");
            if (userId === currentUser.uid) return alert('Magadat nem távolíthatod el.');
            if (!confirm(`Biztosan eltávolítod: "${userEmail || userId}"?`)) return;
            setAdminLoading(true);
            try {
                await firestore.collection('allowedUsers').doc(userId).delete();
                alert(`"${userEmail || userId}" eltávolítva.`);
            } catch (error) { alert(`Hiba: ${error.message}`); }
            finally { setAdminLoading(false); }
        }
        async function toggleAdminStatus(userId, userEmail, currentIsAdmin) {
              if (!currentUser?.isAdmin || !firestore) return alert("Nincs jogosultságod.");
             if (userId === currentUser.uid) return alert('Saját státuszodat nem módosíthatod.');
             setAdminLoading(true);
             try {
                 await firestore.collection('allowedUsers').doc(userId).update({ isAdmin: !currentIsAdmin });
                 alert(`"${userEmail || userId}" admin státusza módosítva.`);
             } catch (error) { alert(`Hiba: ${error.message}`); }
             finally { setAdminLoading(false); }
        }
        function setAdminLoading(isLoading) {
              const overlay = document.getElementById('admin-action-overlay');
             const inputs = adminViewDiv.querySelectorAll('.admin-input');
             const buttons = adminViewDiv.querySelectorAll('.admin-action-button');
             if (isLoading) {
                 overlay?.classList.remove('hidden');
                 inputs.forEach(input => input.disabled = true);
                 buttons.forEach(button => button.disabled = true);
             } else {
                 overlay?.classList.add('hidden');
                 inputs.forEach(input => input.disabled = false);
                 buttons.forEach(button => {
                     // Gombok újraengedélyezése (figyelembe véve az eredeti logikát, pl. saját magad törlése)
                     const li = button.closest('li');
                     const userId = li?.dataset.id;
                     const isSelfAction = (button.dataset.action === 'delete-user' || button.dataset.action === 'toggle-admin') && userId === currentUser?.uid;
                     if (!isSelfAction) button.disabled = false;
                 });
             }
        }

        // --- Eseményfigyelők ---
        function setupEventListeners() {
            console.log("Setting up event listeners...");
            window.addEventListener('hashchange', handleRouteChange);
            googleLoginButton.addEventListener('click', handleGoogleLogin);
            modalCancelButton.addEventListener('click', closeBookingModal);
            modalConfirmButton.addEventListener('click', confirmBooking);
            // Admin gombok figyelője delegálással kerül hozzáadásra a renderAdminView-ban
            console.log("Base event listeners attached.");
        }

         // --- Admin Eseménykezelő (Delegálás) ---
        function handleAdminActions(event) {
            const button = event.target.closest('.admin-action-button');
            if (!button) return; // Nem gombra kattintottunk

            const action = button.dataset.action;
            const li = button.closest('li'); // Szülő listaelem keresése
            const id = li?.dataset.id;
            const email = li?.dataset.email;
            const isadmin = li?.dataset.isadmin === 'true'; // String -> boolean konverzió
            const name = li?.querySelector('span')?.textContent; // Terem/Idősáv neve/értéke

            console.log("Admin action:", action, "ID:", id, "Email:", email, "IsAdmin:", isadmin, "Name:", name);

            if (action === 'delete-room' && id && name) deleteRoom(id, name);
            else if (action === 'delete-timeslot' && id && name) deleteTimeSlot(id, name.split(' (')[0]); // Csak az érték kell
            else if (action === 'toggle-admin' && id) toggleAdminStatus(id, email, isadmin);
            else if (action === 'delete-user' && id) deleteAllowedUser(id, email);
            else if (button.id === 'add-room-button') addRoom();
            else if (button.id === 'add-timeslot-button') addTimeSlot();
            else if (button.id === 'add-user-button') addAllowedUser();
        }


        // --- Alkalmazás Indítása ---
        document.addEventListener('DOMContentLoaded', initializeApp);

    </script>

</body>
</html>
